services:
  - type: web
    name: y-axis-api
    runtime: node
    rootDir: .
    buildCommand: |
      npm install --ignore-scripts
      npm run build -w packages/shared
      npx prisma generate --schema=apps/api/prisma/schema.prisma
    startCommand: node node_modules/.bin/tsx apps/api/src/server.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false          # set manually in Render dashboard
      - key: JWT_SECRET
        generateValue: true  # Render auto-generates a secure random value
      - key: WEB_ORIGIN
        sync: false          # set to your Netlify URL after deploying frontend
      - key: PORT
        value: 4000
    healthCheckPath: /api/health
    autoDeploy: true
