services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: workflow
      POSTGRES_DB: workflow
    ports: ["5432:5432"]
    volumes: [workflow-data:/var/lib/postgresql/data]
  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql://workflow:workflow@postgres:5432/workflow
      JWT_SECRET: docker-development-secret
      WEB_ORIGIN: http://localhost:3000
      PORT: 4000
    depends_on: [postgres]
    ports: ["4000:4000"]
  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    depends_on: [api]
    ports: ["3000:3000"]
volumes:
  workflow-data:
